mock: true
толщина_корпуса: 16
# ДОБАВЛЕНО (МОК): деталь с длиной или шириной меньше, мм, — ошибка проверок проекта (толщина не проверяется)
мин_размер_детали: 30
нижний:
  высота: 720            # без ножек
  глубина: 560
  схема: боковины на всю высоту; дно между боковинами; сверху 2 царги между боковинами
  царга_ширина: 100
верхний:
  высота: 720
  глубина: 320
  схема: боковины на всю высоту; дно и крыша между боковинами
пенал: {высота: 2100, глубина: 560}
# ДОБАВЛЕНО (МОК): пенал с нижним ящиком, нишами и одной верхней полкой
правила_пенала: {духовка: oven_60, свч: microwave, высота_фасада_ящика: 280, высота_верхней_полки: "Z + HALF", округление_полки: вниз}
задняя_стенка: {материал: hdf_3_white, отступ_по_контуру: 2, крепёж_шаг: 150}
# высота полки от низа корпуса — ДОБАВЛЕНО (МОК)
# шаг между полками — ДОБАВЛЕНО (МОК): вторая полка на высоте + шаг и т. д., полка должна помещаться под верхней деталью корпуса
полка: {отступ_от_боковин: 1, отступ_спереди: 20, полкодержателей: 4, высота: 300, шаг: 300}
# порог ширины «до 800» — ДОБАВЛЕНО (МОК)
ножки: {высота: 100, до_800: 4, свыше_800: 6, порог_ширины: 800}
фасады:
  зазор: 2                       # по контуру и между фасадами
  высота_нижнего: "H - 4"
  высота_верхнего: "H - 4"  # ДОБАВЛЕНО (МОК)
  одна_дверь_ширина: "W - 4"
  две_двери_если_ширина_больше: 500
  две_двери_ширина: "(W - 4 - 2) / 2"
  # ДОБАВЛЕНО (МОК): число дверей, заданное в наполнении, допустимо только в этих пределах ширины модуля, мм
  одна_дверь_макс_ширина_модуля: 600
  две_двери_мин_ширина_модуля: 300
  ящики_3_шт: {верхний: 140, остальные: делят остаток поровну}
петли_по_высоте_фасада: [[900, 2], [1600, 3], [2000, 4], [9999, 5]]
конфирматы_по_длине_соединения: [[150, 1], [600, 2], [9999, 3]]
заглушки: по одной на конфирмат
саморезы_3_5x16: {на_петлю: 4, на_ящик: 8}
# ДОБАВЛЕНО (МОК): ответные планки — по одной на петлю, ручки — по одной на фасад
ответные_планки: по одной на петлю
ручки: по одной на фасад
# ДОБАВЛЕНО (МОК): какие позиции hardware.yaml идут в модуль
фурнитура:
  петли: hinge_71B3550
  ответные_планки: plate_173L6100
  конфирматы: confirmat_7x50
  заглушки: confirmat_cap_white
  полкодержатели: shelf_pin_5
  опоры: leg_100
  саморезы: screw_3_5x16
# ДОБАВЛЕНО (МОК): конструкция мойки без полки и задней стенки; царги как у нижнего модуля
мойка: {без_полки: true, без_задней_стенки: true}
# ДОБАВЛЕНО (МОК): бутылочница — выдвижная вставка без петель и полки
бутылочница: {вставка: bottle_150, макс_ширина: 150}
# ДОБАВЛЕНО (МОК): комплект для каждого ящика; дно на нижнем крае фасада
ящики:
  комплект: tandembox_M_500
  кромить_детали: false
  внутренняя_ширина: "W - 2 * T"
  высота_нижнего_фасада: "(H - TOP - 2 * GAP) / 2"
  высота_дна: "Z + T"
кромка:
  корпус: передняя видимая кромка, ПВХ 0.8
  царги: одна длинная сторона
  полки: передняя кромка
  запас: 0.10
  округление_закупки: вверх до 0.1 м
ящик_tandembox:   # МОК, сверить с каталогом Blum
  длина_направляющей: 500
  дно: "(внутр_ширина - 75) x (500 - 10)"
  задняя_стенка: "(внутр_ширина - 87) x 68"
  материал: ldsp_16_white

# ДОБАВЛЕНО (МОК): фурнитура верхних модулей
верхние_модули: {навес: hanger_camar807, навесов: 2, подъёмник: aventos_hks, сушка: dryer_750, ширина_сушки: 750, вытяжка: hood_60, мин_глубина_планки: 40, дно_вытяжки: "передняя планка, открытый проём сзади"}

# ДОБАВЛЕНО (МОК): прямые угловые корпуса с одной дверью и заглушкой
угловые_модули:
  смещение_нижнего: 600
  смещение_верхнего: 600
  допуск_стены: 0
  ширина_фасада_нижнего: 450
  ширина_заглушки_верхнего: 150
  глубина_верхнего: 600
  карусель: corner_carousel
  саморезов_заглушки: 4
  материал_заглушки: ldsp_16_white
  кромить_заглушку: true

# ДОБАВЛЕНО (МОК): виды техники из брифа, которые лежат на столешнице (ширину корпуса с нишей не сравнивать)
техника_в_столешницу: [hob, sink]

# ДОБАВЛЕНО (МОК): пустое место ряда (тикет 32). Зазор — запас к ширине техники по брифу или проекту;
# техника — виды, которые могут стоять в пустом месте нижнего ряда (отдельностоящая).
пустое_место:
  зазор: 20
  техника: [fridge, dishwasher, cooker, washing_machine]

# ДОБАВЛЕНО (МОК): общие позиции кухни. Длины считаются по рядам проекта (пенал не в счёт у шины,
# LED и столешницы), запас на стыки и подрезку, штуки целиком; блок питания по длине LED.
# Цоколь не идёт по глухой части углового модуля (угловое смещение): она за боковиной соседа.
общие_позиции:
  запас_на_стыки: 0.05
  цоколь: {позиция: plinth_100, длина_штуки: 4000}
  шина: {позиция: rail_2000, длина_штуки: 2000}
  led: {профиль: led_profile_m, блок_питания: led_psu, метров_на_блок: 5, округление_метров: 1}
  столешница: {стык_в_углу: встык}

# ДОБАВЛЕНО (МОК): правила присадки (тикет 19). Координаты отверстий — от двух базовых кромок детали:
# первые две из списка, чьи оси лежат в плоскости детали. Размеры сверить с каталогами Blum и конфирмата.
присадка:
  базовые_кромки: [нижняя, передняя, левая]
  конфирмат: {отступ_от_лицевой_кромки: 50, отступ_от_задней_кромки: 50, диаметр_в_пласть: 7, диаметр_в_торец: 5, глубина_в_торец: 40}
  петля: {диаметр_чашки: 35, глубина_чашки: 13, отступ_от_кромки_фасада: 22, отступ_от_торца: 100}
  ответная_планка: {отверстий: 2, шаг: 32, отступ_от_передней_кромки: 37, диаметр: 5, глубина: 10}
  # ДОБАВЛЕНО (МОК), тикет 20: ряд под полкодержатели на каждой боковине спереди и сзади (отступы — от кромок полки);
  # центр отверстия под полку — на центр_ниже_полки (радиус штыря, мм, до десятых) ниже нижней пласти полки;
  # у дна или крыши ряд сдвигается на целые шаги, отверстие под полку остаётся в ряду
  полкодержатель: {отверстий_в_ряду: 5, шаг: 32, отступ_от_передней_кромки_полки: 37, отступ_от_задней_кромки_полки: 37, центр_ниже_полки: 2.5, диаметр: 5, глубина: 10}
  # ДОБАВЛЕНО (МОК), тикет 20: направляющая Tandembox на каждой боковине — сверить с каталогом Blum
  направляющая: {отверстия_от_передней_кромки: [37, 261, 453], над_дном_ящика: 6, диаметр: 5, глубина: 13}

# ДОБАВЛЕНО (МОК), тикет 22: порядок этапов сборки модуля в сборочном листе. Набор этапов фиксирован движком
# (корпус, задняя_стенка, полки, ящики, фасады, ручки, опоры): каждый назван один раз, порядок — ваш.
# Строки этапа движок собирает из соединений и фурнитуры модуля; этап без строк у модуля пропускается.
сборка: [корпус, задняя_стенка, полки, ящики, фасады, ручки, опоры]
