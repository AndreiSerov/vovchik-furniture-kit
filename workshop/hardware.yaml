# для_клиента (МОК, тикет 18): как позиция называется в КП после «с» (творительный падеж, без марки);
# для_клиента_мн — та же форма для двух и более штук после числа («двумя выдвижными вёдрами»).
# У позиции без ключа `для_клиента` в строке состава ничего не пишется. Подъёмник — `верхние_модули.подъёмник`.
# ставится (МОК, тикет 22): цех | объект — где позиция ставится. Сборочный лист показывает всю фурнитуру модуля: у «объект» пометка «на объекте» и нет шага сборки (кроме конфирматов и саморезов); чек-лист выезда берёт «объект» (тикет 53).
# Нет ключа — «цех». Здесь на объекте: опоры, ручки, навесы.
