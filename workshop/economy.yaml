# МОК (тикет 17): правила замен варианта «экономия». Не из исходного ТЗ — выдуманы, заменить своими.
# Правило: `где` — какие модули подходят (шаблон; по желанию «подъёмник: true» — у модуля есть подъёмник,
# «вставка: id» — в модуле есть эта вставка); `на` — что меняется в копии проекта (новый шаблон, число полок,
# «убрать_подъёмник», «убрать_вставку»). Новый шаблон собирает наполнение заново: остаётся только указанное в `на`.
# Правило подходит каждому подходящему модулю проекта; первый подошедший случай правила применяется к модулю.
# Что не строится на каком-то модуле, движок пропускает с сообщением по модулю.
mock: true
замены:
  - id: carousel_to_shelf
    название: "Карусель → полка"
    текст_клиенту: "В угловом шкафу вместо поворотной карусели — обычная полка."
    случаи:
      - где: {шаблон: base_corner}
        на: {полок: 1}
  - id: drawers_to_doors
    название: "Ящики Tandembox → двери с полкой"
    текст_клиенту: "Вместо трёх выдвижных ящиков — шкаф с распашными дверями и одной полкой."
    случаи:
      - где: {шаблон: base_drawers}
        на: {шаблон: base_door, полок: 1}
  - id: lift_to_door
    название: "Подъёмник → распашная дверь"
    текст_клиенту: "Верхние шкафы с подъёмным механизмом открываются как обычные — на петлях."
    случаи:
      - где: {шаблон: wall_lift}
        на: {шаблон: wall_door}
      - где: {шаблон: wall_hood, подъёмник: true}
        на: {убрать_подъёмник: true}
      - где: {шаблон: wall_dryer, подъёмник: true}
        на: {убрать_подъёмник: true}
  - id: no_bucket
    название: "Без выдвижного ведра"
    текст_клиенту: "В шкафу под мойкой нет выдвижного ведра для мусора."
    случаи:
      - где: {шаблон: base_sink, вставка: bin_2sec}
        на: {убрать_вставку: bin_2sec}
  - id: no_dryer
    название: "Без сушки для посуды"
    текст_клиенту: "Над мойкой вместо сушки для посуды — обычный шкаф с полкой."
    случаи:
      - где: {шаблон: wall_dryer}
        на: {шаблон: wall_door, полок: 1}
