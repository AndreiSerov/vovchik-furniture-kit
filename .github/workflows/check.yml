name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # полная история: её брал снимок этапа 9 (удалён в 75); оставлена — дёшево и безвредно
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: scripts/sync-skills
      - run: scripts/doctor
      - run: scripts/check
