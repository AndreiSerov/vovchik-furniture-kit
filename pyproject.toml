[project]
name = "vovchik-furniture-kit"
version = "0.1.0"
description = "Моделирование мебели на заказ: 3D-модель, план раскроя, расчёт материалов."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
