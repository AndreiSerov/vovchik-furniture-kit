[project]
name = "vovchik-furniture-kit"
version = "0.1.0"
description = "Моделирование мебели на заказ: 3D-модель, план раскроя, расчёт материалов."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
    "rectpack>=0.2.2",
    "reportlab>=5.1.0",
    "typer>=0.29.1",
]

[dependency-groups]
dev = [
    "pypdf>=7.1.0",
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
kitchen = "kitchen.cli:app"

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "kitchen"
module-root = "engine"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
